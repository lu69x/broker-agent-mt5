name: Build MT5 Agent

on:
  push:
    branches: [main, dev]
    paths:
      - 'broker_agent/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r broker_agent/requirements.txt

      - name: Generate gRPC stubs
        run: |
          python -m grpc_tools.protoc \
            --proto_path=broker_service/proto/mt5/v1 \
            --python_out=broker_agent/proto/mt5/v1 \
            --grpc_python_out=broker_agent/proto/mt5/v1 \
            broker_service/proto/mt5/v1/mt5.proto

      - name: Build with PyInstaller
        run: |
          pyinstaller \
            --onefile \
            --name mt5_agent \
            --add-data "broker_agent/config.yaml:." \
            --hidden-import MetaTrader5 \
            --hidden-import grpc \
            --hidden-import protobuf \
            broker_agent/main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mt5-agent-exe
          path: dist/mt5_agent.exe
