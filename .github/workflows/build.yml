name: Build MT5 Agent

on:
  push:
    branches: [main, dev]
    paths:
      - 'broker_agent/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve project paths
        id: paths
        shell: pwsh
        run: |
          if (Test-Path "broker_agent/requirements.txt") {
            "agent_dir=broker_agent" >> $env:GITHUB_OUTPUT
          } elseif (Test-Path "requirements.txt") {
            "agent_dir=." >> $env:GITHUB_OUTPUT
          } else {
            throw "requirements.txt not found"
          }

          if (Test-Path "broker_service/proto/mt5/v1/mt5.proto") {
            "proto_file=broker_service/proto/mt5/v1/mt5.proto" >> $env:GITHUB_OUTPUT
            "proto_dir=broker_service/proto/mt5/v1" >> $env:GITHUB_OUTPUT
            "has_proto=true" >> $env:GITHUB_OUTPUT
          } elseif (Test-Path "../broker_service/proto/mt5/v1/mt5.proto") {
            "proto_file=../broker_service/proto/mt5/v1/mt5.proto" >> $env:GITHUB_OUTPUT
            "proto_dir=../broker_service/proto/mt5/v1" >> $env:GITHUB_OUTPUT
            "has_proto=true" >> $env:GITHUB_OUTPUT
          } elseif (Test-Path "proto/mt5/v1/mt5.proto") {
            "proto_file=proto/mt5/v1/mt5.proto" >> $env:GITHUB_OUTPUT
            "proto_dir=proto/mt5/v1" >> $env:GITHUB_OUTPUT
            "has_proto=true" >> $env:GITHUB_OUTPUT
          } elseif (Test-Path "broker_agent/proto/mt5/v1/mt5.proto") {
            "proto_file=broker_agent/proto/mt5/v1/mt5.proto" >> $env:GITHUB_OUTPUT
            "proto_dir=broker_agent/proto/mt5/v1" >> $env:GITHUB_OUTPUT
            "has_proto=true" >> $env:GITHUB_OUTPUT
          } else {
            "has_proto=false" >> $env:GITHUB_OUTPUT
          }

      - name: Install dependencies
        run: pip install -r ${{ steps.paths.outputs.agent_dir }}/requirements.txt

      - name: Generate gRPC stubs
        if: steps.paths.outputs.has_proto == 'true'
        run: |
          python -m grpc_tools.protoc \
            --proto_path=${{ steps.paths.outputs.proto_dir }} \
            --python_out=${{ steps.paths.outputs.agent_dir }}/proto/mt5/v1 \
            --grpc_python_out=${{ steps.paths.outputs.agent_dir }}/proto/mt5/v1 \
            ${{ steps.paths.outputs.proto_file }}

      - name: Verify generated stubs exist when proto is absent
        if: steps.paths.outputs.has_proto != 'true'
        shell: pwsh
        run: |
          $pb2 = "${{ steps.paths.outputs.agent_dir }}/proto/mt5/v1/mt5_pb2.py"
          $grpc = "${{ steps.paths.outputs.agent_dir }}/proto/mt5/v1/mt5_pb2_grpc.py"
          if (!(Test-Path $pb2) -or !(Test-Path $grpc)) {
            throw "mt5.proto not found and generated stubs are missing ($pb2, $grpc)"
          }

      - name: Build with PyInstaller
        run: |
          pyinstaller \
            --onefile \
            --name mt5_agent \
            --add-data "${{ steps.paths.outputs.agent_dir }}/config.yaml:." \
            --hidden-import MetaTrader5 \
            --hidden-import grpc \
            --hidden-import protobuf \
            ${{ steps.paths.outputs.agent_dir }}/main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mt5-agent-exe
          path: dist/mt5_agent.exe
